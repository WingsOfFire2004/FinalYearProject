<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Food Grains | SupplyChainX</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.5.2/dist/web3.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #004080;
            --primary-dark: #002d5a;
            --accent: #00d4ff;
            --glass: rgba(255, 255, 255, 0.95);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(rgba(0, 64, 128, 0.8), rgba(0, 64, 128, 0.8)), 
                        url('./images/food.jpg') center/cover no-repeat fixed;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navigation Header */
        .website-name {
            text-align: center;
            font-size: 1.8rem;
            font-weight: bold;
            padding: 15px;
            background-color: #001f3f;
            color: white;
            letter-spacing: 1px;
        }

        nav {
            background-color: var(--primary);
            padding: 10px 0;
            display: flex;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .nav-links { display: flex; gap: 25px; }

        .nav-link {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 8px 15px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .nav-link:hover { background-color: #001f3f; color: var(--accent); }

        /* Main Content Area */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        h1 { color: white; margin-bottom: 30px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }

        /* Procurement Form Card */
        .form-container {
            background: var(--glass);
            padding: 35px;
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.3);
        }

        form { display: flex; flex-direction: column; gap: 15px; }

        label { 
            font-weight: 600; 
            color: var(--primary-dark); 
            font-size: 0.9rem;
            margin-bottom: -5px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ced4da;
            border-radius: 8px;
            font-family: inherit;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            font-size: 1rem;
        }

        button:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* Barcode Section - Logic controlled */
        #barcodeContainer {
            margin-top: 25px;
            padding: 20px;
            background: white;
            border-radius: 12px;
            text-align: center;
            display: none; /* STAYS HIDDEN UNTIL SUCCESS TRIGGER */
            border: 2px dashed var(--primary);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #barcodeContainer h3 { color: var(--primary); margin-top: 0; }

        footer {
            background: #001f3f;
            color: rgba(255,255,255,0.6);
            text-align: center;
            padding: 15px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="website-name">SupplyChainX</div>
        <nav>
            <div class="nav-links">
                <a href="/main/stake.html" class="nav-link">Home</a>
                <a href="procure.html" class="nav-link" style="color: var(--accent);">Add Item</a>
                <a href="warehouse.html" class="nav-link">View Warehouse</a>
            </div>
        </nav>
    </header>

    <main>
        <h1>ADD FOOD GRAINS</h1>

        <div class="form-container">
            <form id="foodForm">
                <label for="productName">Product Name</label>
                <input type="text" id="productName" placeholder="e.g. Basmati Rice" required>
                
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" placeholder="Quantity in KG" required>
                
                <label for="date">Date of Arrival</label>
                <input type="date" id="date" required>

                <button type="button" onclick="submitForm()">Submit to Ledger</button>
            </form>

            <div id="barcodeContainer">
                <h3>Success! Barcode Generated:</h3>
                <svg id="barcode"></svg>
                <p style="font-size: 0.8rem; color: #666; margin-top: 10px;">
                    Data secured in Blockchain & Database.
                </p>
            </div>
        </div>
    </main>

    <footer>&copy; 2026 SupplyChainX | Stakeholder Portal</footer>

    <script src="script.js"></script>
</body>
</html>
