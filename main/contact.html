<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        /* General Body Settings */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-image: url('food.jpg'); /* Update this path to your chosen background image */
            background-size: cover;
            background-position: center;
        }

        /* Header Styles */
        header {
            background-color: #004080; /* Dark blue background */
            color: white;
            padding: 20px 0;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .header-content h1 {
            margin: 0;
            font-size: 36px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            padding: 10px;
            transition: background-color 0.3s;
        }

        .nav-links a:hover {
            background-color: #0056b3; /* Lighter blue on hover */
            border-radius: 5px;
        }

        /* Main Content Styles */
        main {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            padding: 20px;
        }

        .contact-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.8); /* Semi-transparent background for the content box */
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            max-width: 800px; /* Reduced width */
            width: 100%;
        }

        .contact-info,
        .contact-form {
            width: 100%;
            margin-bottom: 20px;
        }

        .contact-info h2,
        .contact-form h2 {
            margin-top: 0;
        }

        .contact-info ul {
            list-style: none;
            padding: 0;
        }

        .contact-info ul li {
            margin-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
        }

        button {
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;
        }

        /* Footer Styles */
        footer {
            background-color: #004080; /* Dark blue background */
            color: white;
            text-align: center;
            padding: 15px;
        }

    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>SupplyChainX</h1>
            <nav class="nav-links">
                <a href="home.html">Home</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact Us</a>
            </nav>
        </div>
    </header>
    <main>
        <div class="contact-container">
            <div class="contact-info">
                <h2>Contact Information</h2>
                <p>If you have any questions or need further information, please reach out to us using the following contact details:</p>
                <ul>
                    <li>Email: abc@supplychainx.com</li>
                    <li>Phone: +123 456 7890</li>
                </ul>
            </div>
            <div class="contact-form">
                <h2>Get in Touch</h2>
                <form action="submit-form.php" method="POST">
                    <div class="form-group">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message:</label>
                        <textarea id="message" name="message" rows="4" required></textarea>
                    </div>
                    <button type="submit">Send Message</button>
                </form>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2024 SupplyChainX</p>
    </footer>
</body>
</html>
